name: Comfort limit UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/ComfortLimit*.swift'
      - 'Sleepypod/Views/Temp/ComfortLimitScreen.swift'
      - 'Sleepypod/Views/Temp/TemperatureOwnershipView.swift'
      - 'SleepypodUITests/ComfortLimitUITests.swift'
      - '.github/workflows/comfort-limit-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comfort:
    name: Comfort limit (${{ matrix.form }})
    runs-on: macos-15-intel
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select simulator
        run: |
          COMFORT_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'COMFORT_SIM_ID=%s\n' "$COMFORT_SIM_ID" >> "$GITHUB_ENV"
      - name: Build UI tests
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$COMFORT_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/ComfortBuild" \
            -only-testing:SleepypodUITests/ComfortLimitUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$COMFORT_SIM_ID" -b
      - name: Verify comfort editor
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$COMFORT_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/ComfortBuild" \
            -only-testing:SleepypodUITests/ComfortLimitUITests \
            -resultBundlePath "$RUNNER_TEMP/Comfort.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfort-limit-${{ matrix.form }}
          path: ${{ runner.temp }}/Comfort.xcresult
          if-no-files-found: ignore
          retention-days: 7
