name: Control practice UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/ControlPractice*.swift'
      - 'Sleepypod/**/Household*.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'SleepypodUITests/ControlPracticeUITests.swift'
      - 'SleepypodUITests/Household*.swift'
      - 'Sleepypod/Views/Settings/SettingsSheet.swift'
      - '.github/workflows/control-practice-ui.yml'
      - 'scripts/verify-practice-ui.sh'
      - 'scripts/build-simulator-ui.sh'
      - 'scripts/tests/test_simulator_build.py'
  workflow_dispatch:

permissions:
  contents: read

# Retain only the newest revision of each PR; superseded runs cannot establish release readiness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-bundle:
    name: Build practice UI bundle
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build all UI tests once
        timeout-minutes: 30
        run: bash scripts/verify-practice-ui.sh build all
      - name: Archive signed products and source revision
        run: |
          mkdir -p "$RUNNER_TEMP/PracticeBundle"
          ditto -c -k --keepParent "$RUNNER_TEMP/PracticeBuild/Build/Products" "$RUNNER_TEMP/PracticeBundle/Products.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/PracticeBundle/source-revision.txt"
          xcodebuild -version > "$RUNNER_TEMP/PracticeBundle/xcode-version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: practice-ui-bundle
          path: ${{ runner.temp }}/PracticeBundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  practice:
    name: Practice checks (${{ matrix.form }}, ${{ matrix.suite }})
    needs: ui-bundle
    runs-on: macos-15-intel
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Bound each group without dropping any phone or tablet scenario.
      max-parallel: 2
      matrix:
        form: [iPhone, iPad]
        suite: [journey, accessibility, invitations]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: practice-ui-bundle
          path: ${{ runner.temp }}/PracticeBundle
      - name: Restore same-revision UI test bundle
        run: |
          test "$(cat "$RUNNER_TEMP/PracticeBundle/source-revision.txt")" = "$(git rev-parse HEAD)"
          xcodebuild -version > "$RUNNER_TEMP/current-xcode-version.txt"
          cmp "$RUNNER_TEMP/PracticeBundle/xcode-version.txt" "$RUNNER_TEMP/current-xcode-version.txt"
          ditto -x -k "$RUNNER_TEMP/PracticeBundle/Products.zip" "$RUNNER_TEMP/PracticeBundle"
          PRACTICE_TEST_RUN=$(python3 -c '
          import pathlib, sys
          matches = list(pathlib.Path(sys.argv[1]).glob("*.xctestrun"))
          if len(matches) != 1: sys.exit("Expected exactly one shared UI test run")
          print(matches[0])' "$RUNNER_TEMP/PracticeBundle/Products")
          printf 'PRACTICE_TEST_RUN=%s\n' "$PRACTICE_TEST_RUN" >> "$GITHUB_ENV"
      - name: Select simulator
        run: |
          PRACTICE_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'PRACTICE_SIM_ID=%s\n' "$PRACTICE_SIM_ID" >> "$GITHUB_ENV"
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$PRACTICE_SIM_ID" -b
      - name: Verify practice and personal invitations
        timeout-minutes: 20
        run: bash scripts/verify-practice-ui.sh test "${{ matrix.suite }}"
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-${{ matrix.form }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/Practice-${{ matrix.suite }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
