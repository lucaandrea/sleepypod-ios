name: Control practice UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/ControlPractice*.swift'
      - 'Sleepypod/**/Household*.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'SleepypodUITests/ControlPracticeUITests.swift'
      - 'SleepypodUITests/Household*.swift'
      - 'Sleepypod/Views/Settings/SettingsSheet.swift'
      - '.github/workflows/control-practice-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    name: Control practice (${{ matrix.form }})
    runs-on: macos-15-intel
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select simulator
        run: |
          PRACTICE_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'PRACTICE_SIM_ID=%s\n' "$PRACTICE_SIM_ID" >> "$GITHUB_ENV"
      - name: Build practice tests
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$PRACTICE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/PracticeBuild" CODE_SIGNING_ALLOWED=NO
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$PRACTICE_SIM_ID" -b
      - name: Verify practice and personal invitations
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$PRACTICE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/PracticeBuild" \
            -only-testing:SleepypodUITests/ControlPracticeUITests \
            -only-testing:SleepypodUITests/HouseholdPreparationUITests \
            -resultBundlePath "$RUNNER_TEMP/Practice.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-practice-${{ matrix.form }}
          path: ${{ runner.temp }}/Practice.xcresult
          if-no-files-found: ignore
          retention-days: 7
