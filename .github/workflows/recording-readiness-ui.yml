name: Everyday screens UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/RecordingReadiness*.swift'
      - 'Sleepypod/Views/Data/SleepScreen.swift'
      - 'SleepypodUITests/RecordingReadinessUITests.swift'
      - 'SleepypodUITests/WatchRecordingUITests.swift'
      - 'SleepypodUITests/LearningJourneyUITests.swift'
      - 'Sleepypod/**/LearningJourney*.swift'
      - 'Sleepypod/**/Tonight*.swift'
      - 'SleepypodFeatures/MorningReportPreview.swift'
      - 'SleepypodFeatures/MorningBrief*.swift'
      - 'FreeSleepKit/Intelligence/MorningBrief.swift'
      - 'FreeSleepKit/Intelligence/ReportSleepComparison.swift'
      - 'FreeSleepKit/Intelligence/PersonalSleepReport.swift'
      - 'FreeSleepKit/Intelligence/PersonalReportPrompt.swift'
      - 'SleepypodUITests/MorningBriefUITests.swift'
      - 'SleepypodUITests/TonightUITests.swift'
      - 'Sleepypod/Views/Schedule/**'
      - 'Sleepypod/**/BackupAlarm*.swift'
      - 'Sleepypod/**/SystemBackupAlarmClient.swift'
      - 'Sleepypod/**/NextAlarm*.swift'
      - 'SleepypodUITests/AlarmParityUITests.swift'
      - 'SleepypodUITests/NextAlarmUITests.swift'
      - 'Sleepypod/**/BedCare*.swift'
      - 'Sleepypod/Views/Status/StatusScreen.swift'
      - 'SleepypodUITests/BedCareUITests.swift'
      - 'Sleepypod/**/TemporaryCooling*.swift'
      - 'SleepypodUITests/TemporaryCoolingUITests.swift'
      - 'Sleepypod/**/TargetResponse*.swift'
      - 'SleepypodUITests/TargetResponseUITests.swift'
      - 'Integration/Fixtures/target-response-example.json'
      - 'Sleepypod/**/NightExplanation*.swift'
      - 'Sleepypod/**/NightTemperature*.swift'
      - 'SleepypodUITests/NightExplanationUITests.swift'
      - 'SleepypodFeatures/WatchRecordingAssistant.swift'
      - 'FreeSleepKit/Intelligence/WatchRecordingSummary.swift'
      - 'FreeSleepKit/Intelligence/HealthHistory*.swift'
      - 'FreeSleepKit/Intelligence/IntelligenceWorkspace.swift'
      - 'Integration/UnifiedWorkspace.swift'
      - 'Sleepypod/**/OwnerConnection*.swift'
      - 'Sleepypod/**/OwnerRoute*.swift'
      - 'Sleepypod/**/EnrolledOwnerRoutes.swift'
      - 'Sleepypod/**/VerifiedOwnerRoutes.swift'
      - 'Sleepypod/Networking/FreeSleepClient.swift'
      - 'Sleepypod/Networking/SleepypodCoreClient.swift'
      - 'SleepypodUITests/OwnerConnectionEnrollmentUITests.swift'
      - 'SleepypodUITests/OwnerRouteSettingsUITests.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'Sleepypod/Views/Shared/OfflineLibraryScreen.swift'
      - '.github/workflows/recording-readiness-ui.yml'
      - 'scripts/verify-everyday-ui.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: everyday-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-bundle:
    name: Build everyday UI bundle
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select build simulator
        run: |
          RECORDING_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith("iPhone")]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])')
          printf 'RECORDING_SIM_ID=%s\n' "$RECORDING_SIM_ID" >> "$GITHUB_ENV"
      - name: Build all UI tests once
        timeout-minutes: 30
        run: bash scripts/verify-everyday-ui.sh build all
      - name: Archive signed products and source revision
        run: |
          mkdir -p "$RUNNER_TEMP/EverydayBundle"
          ditto -c -k --keepParent "$RUNNER_TEMP/RecordingBuild/Build/Products" "$RUNNER_TEMP/EverydayBundle/Products.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/EverydayBundle/source-revision.txt"
          xcodebuild -version > "$RUNNER_TEMP/EverydayBundle/xcode-version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: everyday-ui-bundle
          path: ${{ runner.temp }}/EverydayBundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  recording:
    name: Everyday checks (${{ matrix.form }}, ${{ matrix.suite }})
    needs: ui-bundle
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
        suite: [recording, guidance, morning, wake, cooling, night, response, connection]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: everyday-ui-bundle
          path: ${{ runner.temp }}/EverydayBundle
      - name: Restore same-revision UI test bundle
        run: |
          test "$(cat "$RUNNER_TEMP/EverydayBundle/source-revision.txt")" = "$(git rev-parse HEAD)"
          xcodebuild -version > "$RUNNER_TEMP/current-xcode-version.txt"
          cmp "$RUNNER_TEMP/EverydayBundle/xcode-version.txt" "$RUNNER_TEMP/current-xcode-version.txt"
          ditto -x -k "$RUNNER_TEMP/EverydayBundle/Products.zip" "$RUNNER_TEMP/EverydayBundle"
          EVERYDAY_TEST_RUN=$(python3 -c '
          import pathlib, sys
          matches = list(pathlib.Path(sys.argv[1]).glob("*.xctestrun"))
          if len(matches) != 1: sys.exit("Expected exactly one shared UI test run")
          print(matches[0])' "$RUNNER_TEMP/EverydayBundle/Products")
          printf 'EVERYDAY_TEST_RUN=%s\n' "$EVERYDAY_TEST_RUN" >> "$GITHUB_ENV"
      - name: Select simulator
        run: |
          RECORDING_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'RECORDING_SIM_ID=%s\n' "$RECORDING_SIM_ID" >> "$GITHUB_ENV"
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$RECORDING_SIM_ID" -b
      - name: Verify everyday scenarios
        timeout-minutes: 30
        run: bash scripts/verify-everyday-ui.sh test "${{ matrix.suite }}"
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-${{ matrix.form }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/Recording.xcresult
          if-no-files-found: ignore
          retention-days: 7
