name: Personal context UI

on:
  pull_request:
    paths:
      - 'FreeSleepKit/Intelligence/DaytimeContext*.swift'
      - 'FreeSleepKit/Services/PrivateSnapshotStore.swift'
      - 'SleepypodFeatures/DaytimeContext*.swift'
      - 'SleepypodFeatures/HealthHistoryCard.swift'
      - 'SleepypodFeatures/PodFeatureScreen.swift'
      - 'SleepypodUITests/DaytimeContextUITests.swift'
      - 'Sleepypod/**/MorningJournal*.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'SleepypodUITests/MorningJournalContextUITests.swift'
      - 'Integration/Fixtures/morning-journal-context-example.json'
      - '.github/workflows/daytime-context-ui.yml'
      - 'scripts/build-simulator-ui.sh'
      - 'scripts/tests/test_simulator_build.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: context-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-bundle:
    name: Build personal context UI bundle
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build both context scenarios
        timeout-minutes: 30
        run: |
          bash scripts/build-simulator-ui.sh -project Sleepypod.xcodeproj -scheme Sleepypod \
            -derivedDataPath "$RUNNER_TEMP/ContextBuild" \
            -only-testing:SleepypodUITests/DaytimeContextUITests \
            -only-testing:SleepypodUITests/MorningJournalContextUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Archive signed products and source revision
        run: |
          mkdir -p "$RUNNER_TEMP/ContextBundle"
          ditto -c -k --keepParent "$RUNNER_TEMP/ContextBuild/Build/Products" "$RUNNER_TEMP/ContextBundle/Products.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/ContextBundle/source-revision.txt"
          xcodebuild -version > "$RUNNER_TEMP/ContextBundle/xcode-version.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: personal-context-ui-bundle
          path: ${{ runner.temp }}/ContextBundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  context:
    name: Personal context (${{ matrix.form }}, ${{ matrix.suite }})
    needs: ui-bundle
    runs-on: macos-15-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
        suite: [daytime, journal]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/download-artifact@v4
        with:
          name: personal-context-ui-bundle
          path: ${{ runner.temp }}/ContextBundle
      - name: Restore same-revision UI test bundle
        run: |
          test "$(cat "$RUNNER_TEMP/ContextBundle/source-revision.txt")" = "$(git rev-parse HEAD)"
          xcodebuild -version > "$RUNNER_TEMP/current-xcode-version.txt"
          cmp "$RUNNER_TEMP/ContextBundle/xcode-version.txt" "$RUNNER_TEMP/current-xcode-version.txt"
          ditto -x -k "$RUNNER_TEMP/ContextBundle/Products.zip" "$RUNNER_TEMP/ContextBundle"
          CONTEXT_TEST_RUN=$(python3 -c '
          import pathlib, sys
          matches = list(pathlib.Path(sys.argv[1]).glob("*.xctestrun"))
          if len(matches) != 1: sys.exit("Expected exactly one shared UI test run")
          print(matches[0])' "$RUNNER_TEMP/ContextBundle/Products")
          printf 'CONTEXT_TEST_RUN=%s\n' "$CONTEXT_TEST_RUN" >> "$GITHUB_ENV"
      - name: Select simulator
        run: |
          CONTEXT_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'CONTEXT_SIM_ID=%s\n' "$CONTEXT_SIM_ID" >> "$GITHUB_ENV"
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$CONTEXT_SIM_ID" -b
      - name: Verify context states and accessibility
        timeout-minutes: 45
        run: |
          case '${{ matrix.suite }}' in
            daytime) CONTEXT_TEST_CLASS=DaytimeContextUITests ;;
            journal) CONTEXT_TEST_CLASS=MorningJournalContextUITests ;;
            *) exit 2 ;;
          esac
          xcodebuild test-without-building -xctestrun "$CONTEXT_TEST_RUN" \
            -destination "platform=iOS Simulator,id=$CONTEXT_SIM_ID" \
            "-only-testing:SleepypodUITests/$CONTEXT_TEST_CLASS" \
            -resultBundlePath "$RUNNER_TEMP/Context.xcresult" \
            -collect-test-diagnostics on-failure -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-context-${{ matrix.form }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/Context.xcresult
          if-no-files-found: ignore
          retention-days: 7
