name: Personal quiet UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/PersonalQuiet*.swift'
      - 'Sleepypod/Models/HouseholdSession.swift'
      - 'Sleepypod/Services/HouseholdWorkspace.swift'
      - 'Sleepypod/Views/Household/HouseholdScreen.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'SleepypodUITests/PersonalQuietUITests.swift'
      - 'Integration/Fixtures/personal-quiet-v1.json'
      - '.github/workflows/personal-quiet-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

# Retain only the newest revision of each PR; superseded runs cannot establish release readiness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quiet:
    name: Quiet time (${{ matrix.form }})
    runs-on: macos-15-intel
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select simulator
        run: |
          QUIET_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'QUIET_SIM_ID=%s\n' "$QUIET_SIM_ID" >> "$GITHUB_ENV"
      - name: Build quiet UI tests
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$QUIET_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/QuietBuild" \
            -only-testing:SleepypodUITests/PersonalQuietUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$QUIET_SIM_ID" -b
      - name: Verify shared quiet and recovery
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$QUIET_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/QuietBuild" \
            -only-testing:SleepypodUITests/PersonalQuietUITests \
            -resultBundlePath "$RUNNER_TEMP/Quiet.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-quiet-${{ matrix.form }}
          path: ${{ runner.temp }}/Quiet.xcresult
          if-no-files-found: ignore
          retention-days: 7
