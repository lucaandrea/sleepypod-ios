name: Offline library UI

on:
  pull_request:
    paths:
      - 'FreeSleepKit/Services/PrivateSnapshotStore.swift'
      - 'FreeSleepKit/Intelligence/PersonalIntelligenceStore.swift'
      - 'FreeSleepKit/Intelligence/PersonalHealth*.swift'
      - 'SleepypodFeatures/PersonalHealth*.swift'
      - 'SleepypodFeatures/FeatureActionButtonStyle.swift'
      - 'Sleepypod/Models/PersonalHealthAccess+Household.swift'
      - 'Sleepypod/**/OfflineLibrary*.swift'
      - 'Sleepypod/**/PersonalOffline*.swift'
      - 'Sleepypod/Services/HouseholdWorkspace.swift'
      - 'Sleepypod/Services/HouseholdVault.swift'
      - 'Sleepypod/Services/PersonalHistoryWorkspace.swift'
      - 'Sleepypod/Services/PersonalRoutineWorkspace.swift'
      - 'Sleepypod/Views/Household/HouseholdScreen.swift'
      - 'Sleepypod/Views/Household/HouseholdRootView.swift'
      - 'Sleepypod/Models/SleepRecord.swift'
      - 'Sleepypod/SleepypodApp.swift'
      - 'SleepypodFeatures/SavedPersonalReportsScreen.swift'
      - 'SleepypodUITests/OfflineLibraryUITests.swift'
      - 'SleepypodUITests/PersonalOfflineLibraryUITests.swift'
      - 'SleepypodUITests/PersonalHealthUITests.swift'
      - '.github/workflows/offline-library-ui.yml'
      - 'scripts/run-simulator-ui.py'
      - 'scripts/tests/test_simulator_startup.py'
  workflow_dispatch:

permissions:
  contents: read

# Retain only the newest revision of each PR; superseded runs cannot establish release readiness.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline reading (${{ matrix.form }})
    runs-on: macos-15-intel
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select simulator
        run: |
          OFFLINE_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'OFFLINE_SIM_ID=%s\n' "$OFFLINE_SIM_ID" >> "$GITHUB_ENV"
      # Ad-hoc simulator signing preserves Keychain entitlements. This tests the
      # production key storage rather than substituting a test key for UI runs.
      - name: Build UI tests
        id: offline-build
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$OFFLINE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/OfflineBuild" \
            -only-testing:SleepypodUITests/OfflineLibraryUITests \
            -only-testing:SleepypodUITests/PersonalOfflineLibraryUITests \
            -only-testing:SleepypodUITests/PersonalHealthUITests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$OFFLINE_SIM_ID" -b
      # Intel-hosted simulator startup and the two offline suites exceeded one
      # combined 20-minute step. Keep every scenario with independent budgets.
      - name: Verify owner encrypted offline reading
        timeout-minutes: 20
        run: |
          python3 scripts/run-simulator-ui.py test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$OFFLINE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/OfflineBuild" \
            -only-testing:SleepypodUITests/OfflineLibraryUITests \
            -resultBundlePath "$RUNNER_TEMP/OwnerOffline.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Verify personal encrypted offline reading
        if: ${{ !cancelled() && steps.offline-build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          python3 scripts/run-simulator-ui.py test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$OFFLINE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/OfflineBuild" \
            -only-testing:SleepypodUITests/PersonalOfflineLibraryUITests \
            -resultBundlePath "$RUNNER_TEMP/PersonalOffline.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Verify private Health enrollment and removal
        if: ${{ !cancelled() && steps.offline-build.outcome == 'success' }}
        timeout-minutes: 20
        run: |
          python3 scripts/run-simulator-ui.py test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$OFFLINE_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/OfflineBuild" \
            -only-testing:SleepypodUITests/PersonalHealthUITests \
            -resultBundlePath "$RUNNER_TEMP/PersonalHealth.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-library-${{ matrix.form }}
          path: |
            ${{ runner.temp }}/OwnerOffline*.xcresult
            ${{ runner.temp }}/OwnerOffline-bootstrap-recovery.json
            ${{ runner.temp }}/PersonalOffline*.xcresult
            ${{ runner.temp }}/PersonalOffline-bootstrap-recovery.json
            ${{ runner.temp }}/PersonalHealth*.xcresult
            ${{ runner.temp }}/PersonalHealth-bootstrap-recovery.json
          if-no-files-found: ignore
          retention-days: 7
