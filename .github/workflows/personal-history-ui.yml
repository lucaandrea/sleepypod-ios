name: Personal recordings UI

on:
  pull_request:
    paths:
      - 'Sleepypod/**/PersonalHistory*.swift'
      - 'Sleepypod/Services/HouseholdWorkspace.swift'
      - 'Sleepypod/Views/Household/HouseholdScreen.swift'
      - 'SleepypodUITests/PersonalHistoryUITests.swift'
      - 'Integration/Fixtures/personal-history-v1.json'
      - '.github/workflows/personal-history-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recordings:
    name: Recordings (${{ matrix.form }})
    runs-on: macos-15-intel
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        form: [iPhone, iPad]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Select simulator
        run: |
          RECORDINGS_SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          matches = [device["udid"] for runtime, group in sorted(json.load(sys.stdin)["devices"].items(), reverse=True)
                     if ".iOS-26-" in runtime for device in group if device["name"].startswith(sys.argv[1])]
          if not matches: sys.exit("Requested iOS 26 simulator is unavailable")
          print(matches[0])' '${{ matrix.form }}')
          printf 'RECORDINGS_SIM_ID=%s\n' "$RECORDINGS_SIM_ID" >> "$GITHUB_ENV"
      - name: Build UI tests
        timeout-minutes: 30
        run: |
          xcodebuild build-for-testing -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$RECORDINGS_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/RecordingsBuild" \
            -only-testing:SleepypodUITests/PersonalHistoryUITests CODE_SIGNING_ALLOWED=NO
      - name: Boot simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$RECORDINGS_SIM_ID" -b
      - name: Verify personal recordings
        timeout-minutes: 20
        run: |
          xcodebuild test-without-building -project Sleepypod.xcodeproj -scheme Sleepypod \
            -destination "platform=iOS Simulator,id=$RECORDINGS_SIM_ID" \
            -derivedDataPath "$RUNNER_TEMP/RecordingsBuild" \
            -only-testing:SleepypodUITests/PersonalHistoryUITests \
            -resultBundlePath "$RUNNER_TEMP/Recordings.xcresult" \
            -collect-test-diagnostics never -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Preserve screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-recordings-${{ matrix.form }}
          path: ${{ runner.temp }}/Recordings.xcresult
          if-no-files-found: ignore
          retention-days: 7
